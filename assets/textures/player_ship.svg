<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cockpitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Wing Thruster Trails / Glow -->
  <polygon points="40,110 44,124 48,110" fill="#38bdf8" opacity="0.8" />
  <polygon points="80,110 84,124 88,110" fill="#38bdf8" opacity="0.8" />
  <polygon points="60,116 64,128 68,116" fill="#00f0ff" filter="url(#glow)" />

  <!-- Main Wings Base -->
  <polygon points="64,16 118,92 110,108 86,100 64,114 42,100 18,108 10,92" fill="url(#wingGrad)" stroke="#0ea5e9" stroke-width="2" />

  <!-- Outer Wing Cannons -->
  <rect x="14" y="58" width="6" height="42" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="17" cy="56" r="3" fill="#38bdf8" filter="url(#glow)" />
  <rect x="108" y="58" width="6" height="42" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="111" cy="56" r="3" fill="#38bdf8" filter="url(#glow)" />

  <!-- Center Fuselage Body -->
  <polygon points="64,10 84,60 76,104 64,112 52,104 44,60" fill="url(#hullGrad)" stroke="#bae6fd" stroke-width="2" />

  <!-- Wing Armor Plating Accents -->
  <polygon points="64,36 94,84 82,92 64,54" fill="#0284c7" opacity="0.7" />
  <polygon points="64,36 34,84 46,92 64,54" fill="#0284c7" opacity="0.7" />

  <!-- Cockpit Canopy -->
  <ellipse cx="64" cy="50" rx="9" ry="20" fill="url(#cockpitGrad)" stroke="#e0f2fe" stroke-width="1.5" filter="url(#glow)" />
  <ellipse cx="62" cy="44" rx="4" ry="10" fill="#ffffff" opacity="0.6" />

  <!-- Main Nose Blaster -->
  <polygon points="61,12 67,12 64,2" fill="#38bdf8" filter="url(#glow)" />
</svg>
